<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>HOSPITAL TRACKING SYSTEM</title>
    <link rel="icon" type="image/png" href="/src/assets/images/hospital_logo_1779218652866.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/src/assets/images/hospital_logo_1779218652866.png" />
  </head>
  <body>
    <script>
      // Clear old service workers from previous PWA attempts silently
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          let hasUnregistered = false;
          for (let registration of registrations) {
            registration.unregister();
            hasUnregistered = true;
          }
          if (hasUnregistered) {
            // Give it a second to unregister, then reload to bypass old cache
            setTimeout(() => window.location.reload(), 500);
          }
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
